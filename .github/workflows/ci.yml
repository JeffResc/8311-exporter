name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  build:
    name: cross-compile (linux/mips/softfloat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build MIPS binary
        env:
          GOOS: linux
          GOARCH: mips
          GOMIPS: softfloat
        run: |
          mkdir -p bin
          go build -trimpath -ldflags='-s -w -X main.version=ci' -o bin/8311-exporter.mips ./cmd/8311-exporter
          file bin/8311-exporter.mips
          ls -la bin/8311-exporter.mips
